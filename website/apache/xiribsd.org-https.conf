# Replace the initial xiribsd.org.conf with this file after issuing the
# xiribsd.org certificate. Do not enable both templates at the same time.
<VirtualHost *:80>
    ServerName xiribsd.org
    DocumentRoot /var/www/xiribsd.org/public

    <Directory /var/www/xiribsd.org/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Certbot's webroot renewal must remain reachable over HTTP.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://xiribsd.org%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName xiribsd.org
    DocumentRoot /var/www/xiribsd.org/public
    DirectoryIndex index.html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/xiribsd.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/xiribsd.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Directory /var/www/xiribsd.org/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    <IfModule headers_module>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    </IfModule>

    # Inherit existing logging and TLS policy; other virtual hosts are separate.
</VirtualHost>
